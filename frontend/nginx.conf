# Proxy del frontend: estáticos + `/api` al backend.
#
# `backend` es el nombre del servicio en el compose (resolución interna de
# Docker). Se reenvían las cabeceras de IP real: con un solo nginx delante,
# la API debe arrancar con `TRUST_PROXY=1` (ver docs/despliegue.md).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API: conserva la ruta `/api/...` tal cual (el backend ya lleva el prefijo).
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # El refresh viaja en cookie httpOnly: sin esto el login no sobrevive
    # al proxy.
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
  }

  # Estáticos con caché larga (Vite les pone hash en el nombre)...
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ...y el resto es la SPA (el enrutador de Vue resuelve la ruta).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
