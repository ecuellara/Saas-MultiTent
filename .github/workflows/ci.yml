name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dental_saas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/dental_saas_test
      JWT_SECRET: secreto-de-pruebas-de-al-menos-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: npx prisma migrate deploy
      - run: npx vitest run --config vitest.config.e2e.ts --fileParallelism=false
      # Arranque REAL del binario compilado. Cubre fallos que las pruebas no
      # pueden ver: transforman con Oxc (sí emite metadatos de decorador) y no
      # pasan por dist/main.js. Ver scripts/smoke-arranque.mjs.
      - run: npm run db:seed
        env:
          PLATFORM_OWNER_EMAIL: owner@test.pe
          PLATFORM_OWNER_PASSWORD: Plataforma-Arranque-2026!
      - run: npm run db:seed-demo
        env:
          DEMO_OWNER_EMAIL: demo@test.pe
          DEMO_OWNER_PASSWORD: Demo-Arranque-2026!
      # SIMULACRO de restauración: vuelca, restaura en una base de usar y tirar y
      # compara filas. Va DESPUÉS de los seeds A PROPÓSITO: con la base vacía la
      # comparación no muerde y solo se verificaría la mecánica, no el contenido.
      # Requiere cliente Postgres local (el servicio solo expone el servidor).
      - run: sudo apt-get update -y && sudo apt-get install -y postgresql-client
      - run: node scripts/prueba-restauracion.mjs
        env:
          PG_DUMP_BIN: pg_dump
          PG_RESTORE_BIN: pg_restore
      # Simulacro de ARCHIVOS: hermético (temporal propio, nunca toca uploads/),
      # así que no depende de los seeds. `tar` viene en la imagen de ubuntu.
      - run: node scripts/prueba-restauracion-archivos.mjs
      # Simulacro del RESPALDO EXTERNO (deuda nº 14): vuelca, copia a un
      # destino temporal, corrompe la copia (la verificación debe detectarlo),
      # borra BACKUP_DIR y restaura DESDE la copia externa comparando filas y
      # sha256. Sin rclone a propósito: destino local.
      - run: node scripts/prueba-respaldo-remoto.mjs
        env:
          PG_DUMP_BIN: pg_dump
          PG_RESTORE_BIN: pg_restore
      - run: npm run smoke:arranque
        env:
          DEMO_OWNER_EMAIL: demo@test.pe
          DEMO_OWNER_PASSWORD: Demo-Arranque-2026!

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `typecheck` cubre tipos y plantillas de .vue (vue-tsc);
      # `build` cubre además el empaquetado real de Vite y Tailwind.
      - run: npm run typecheck
      - run: npm run build

  despliegue:
    # El Dockerfile no se puede pudrir en silencio: se construyen las imágenes
    # y se levanta el staging comprobando `/api/health` por el proxy y en
    # directo. No se publica nada (sin registry, sin secretos: el .env.staging
    # de aquí lleva solo valores de prueba).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear .env.staging de CI (prueba, no secretos)
        run: |
          cat > .env.staging <<'EOF'
          STAGING_DB_PASSWORD=test
          JWT_SECRET=secreto-de-pruebas-de-al-menos-32-caracteres-ok
          PLATFORM_OWNER_EMAIL=owner@test.pe
          PLATFORM_OWNER_PASSWORD=Plataforma-Arranque-2026!
          DEMO_OWNER_EMAIL=demo@test.pe
          DEMO_OWNER_PASSWORD=Demo-Arranque-2026!
          EOF
      - run: docker compose --env-file .env.staging -f compose.staging.yml build backend proxy herramientas
      - run: docker compose --env-file .env.staging -f compose.staging.yml up -d --wait db
      - run: docker compose --env-file .env.staging -f compose.staging.yml run --rm herramientas npx prisma migrate deploy
      - run: docker compose --env-file .env.staging -f compose.staging.yml run --rm herramientas npm run db:seed
      - run: docker compose --env-file .env.staging -f compose.staging.yml up -d --wait
      - name: Comprobar /api/health (proxy y directo, con base ok)
        run: |
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"database":"ok"'
          curl -fsS http://127.0.0.1:3001/api/health | grep -q '"database":"ok"'
      - run: docker compose --env-file .env.staging -f compose.staging.yml down -v
        if: always()
